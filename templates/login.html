<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 20px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background: linear-gradient(to right, #4361ee, #3a0ca3);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(to right, #3a0ca3, #4361ee);
        }
        .input-group-text {
            background-color: #f8f9fa;
        }
        .shake {
            animation: shake 0.5s;
        }
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);}
            20%, 40%, 60%, 80% {transform: translateX(5px);}
        }
        .is-invalid {
            border-color: #dc3545 !important;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25) !important;
        }
        .field-error {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Welcome Back</h2>
                        <p class="text-muted">Sign in to continue</p>
                    </div>
                    
                    <!-- Flash messages from server -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <!-- Validation error alert -->
                    <div class="alert alert-danger alert-dismissible fade show" role="alert" style="display: none;" id="errorAlert">
                        <span id="errorMessage">Please fill in all required fields</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    
                    <form method="POST" id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="field-error" id="emailError"></div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="field-error" id="passwordError"></div>
                        </div>
                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                        <div class="text-center">
                            <a href="{{ url_for('signup') }}" class="text-decoration-none">Create an account</a>
                            <span class="mx-2">•</span>
                            <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot password?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const password = document.getElementById('password');
        const icon = this.querySelector('i');
        if (password.type === 'password') {
            password.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            password.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });

    // Email validation function
    function isValidEmail(email) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
    }

    // Form validation
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const email = document.getElementById('email').value.trim();
        const errorAlert = document.getElementById('errorAlert');
        const errorMessage = document.getElementById('errorMessage');
        
        // Reset previous states
        document.getElementById('password').classList.remove('is-invalid', 'shake');
        document.getElementById('email').classList.remove('is-invalid', 'shake');
        
        // Hide individual error messages
        document.getElementById('emailError').style.display = 'none';
        document.getElementById('passwordError').style.display = 'none';
        
        errorAlert.style.display = 'none';
        
        let hasError = false;
        let specificErrorMessage = '';
        
        // Check each field individually with priority
        if (!email) {
            const emailField = document.getElementById('email');
            emailField.classList.add('is-invalid', 'shake');
            document.getElementById('emailError').textContent = 'Email is required';
            document.getElementById('emailError').style.display = 'block';
            specificErrorMessage = 'Please enter your email address';
            hasError = true;
        } else if (!isValidEmail(email)) {
            const emailField = document.getElementById('email');
            emailField.classList.add('is-invalid', 'shake');
            document.getElementById('emailError').textContent = 'Please enter a valid email address';
            document.getElementById('emailError').style.display = 'block';
            specificErrorMessage = 'Please enter a valid email address';
            hasError = true;
        } else if (!password) {
            const passwordField = document.getElementById('password');
            passwordField.classList.add('is-invalid', 'shake');
            document.getElementById('passwordError').textContent = 'Password is required';
            document.getElementById('passwordError').style.display = 'block';
            specificErrorMessage = 'Please enter your password';
            hasError = true;
        }
        
        if (hasError) {
            e.preventDefault();
            
            // Show specific error message in alert
            errorMessage.textContent = specificErrorMessage;
            errorAlert.style.display = 'block';
            
            // Remove shake animation after it completes
            setTimeout(() => {
                document.getElementById('password').classList.remove('shake');
                document.getElementById('email').classList.remove('shake');
            }, 500);
            
            // Remove validation classes after a longer delay (but keep individual error messages)
            setTimeout(() => {
                document.getElementById('password').classList.remove('is-invalid');
                document.getElementById('email').classList.remove('is-invalid');
            }, 3000);
        }
    });

    // Real-time validation as user types
    document.getElementById('email').addEventListener('blur', function() {
        const email = this.value.trim();
        const emailError = document.getElementById('emailError');
        
        if (!email) {
            this.classList.add('is-invalid');
            emailError.textContent = 'Email is required';
            emailError.style.display = 'block';
        } else if (!isValidEmail(email)) {
            this.classList.add('is-invalid');
            emailError.textContent = 'Please enter a valid email address';
            emailError.style.display = 'block';
        } else {
            this.classList.remove('is-invalid');
            emailError.style.display = 'none';
        }
    });

    document.getElementById('password').addEventListener('blur', function() {
        const password = this.value;
        const passwordError = document.getElementById('passwordError');
        
        if (!password) {
            this.classList.add('is-invalid');
            passwordError.textContent = 'Password is required';
            passwordError.style.display = 'block';
        } else {
            this.classList.remove('is-invalid');
            passwordError.style.display = 'none';
        }
    });
</script>
</body>
</html>
