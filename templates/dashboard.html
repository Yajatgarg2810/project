<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            height: 100vh;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            text-align: center;
        }
        h2 {
            color: #333;
        }
    </style>
    <!-- Add this to your dashboard.html -->
{% if session.get('is_admin', 0) %}
<div class="col-md-4 mb-4">
    <div class="card">
        <div class="card-body text-center">
            <i class="fas fa-users fa-3x text-primary mb-3"></i>
            <h5>User Management</h5>
            <p>View and manage all registered users</p>
            <a href="{{ url_for('view_users') }}" class="btn btn-outline-primary">View Users</a>
        </div>
    </div>
</div>
{% endif %}
</head>
<body>
    <div class="container">
        <h2>Welcome, {{ user }}</h2>
        <p>You are now logged in.</p>
        <a href="/">Logout</a>
    </div>
</body>
</html>
